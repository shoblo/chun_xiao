<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>处 · 春晓</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f6efdf;--paper2:#fffdf6;--ink:#1b1b1b;--red:#b5342a;--line:#8a8578;--wash:#ece6d6;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'300'%20height%3D'300'%3E%3Cfilter%20id%3D'n'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.8'%20numOctaves%3D'3'%20seed%3D'4'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%20.45%20%200%200%200%200%20.38%20%200%200%200%200%20.25%20%200%200%200%20.09%200'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'300'%20height%3D'300'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E");color:var(--ink);font-family:'Noto Serif SC','Songti SC','STSong','Noto Serif CJK SC','SimSun',serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
a{color:inherit}
.ic{display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.wrap{max-width:520px;margin:0 auto;padding:14px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.picbox{width:100%;max-width:340px;aspect-ratio:4/3;border:3px solid var(--ink);border-radius:6px;background:var(--paper2);overflow:hidden}
.picbox .pic-svg{display:none;width:100%;height:100%}
.picbox .pic-svg.on{display:block}
.sq{width:min(100%,340px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;background:var(--paper2)}
.sq svg{width:100%;height:100%;display:block}
.mid{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
.py{height:36px;font-size:27px;font-weight:600;letter-spacing:.04em;line-height:36px;transition:opacity .15s}
.py.hide{opacity:0}
.big{width:100%;max-width:340px;min-height:132px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;font-family:'Ma Shan Zheng','KaiTi','STKaiti','Kaiti SC',serif;font-size:clamp(100px,34vw,140px);line-height:1.05;color:var(--ink);overflow:hidden;white-space:nowrap}
.big.en{font-family:'Noto Serif SC','Songti SC',serif;font-weight:600;color:var(--red)}
.vars{display:flex;gap:8px;width:100%;max-width:420px}
.vb{flex:1 1 0;min-width:0;min-height:64px;padding:0 2px;border:3px solid var(--ink);border-radius:14px;background:var(--paper2);font-size:clamp(15px,4.7vw,21px);cursor:pointer;white-space:nowrap}
.vb[aria-pressed=true]{background:var(--ink);color:var(--paper)}
h2{margin:6px 0 0;font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;font-weight:400;font-size:34px;letter-spacing:.04em}
.words{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.wd{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--paper2);cursor:pointer;text-align:left}
.wd.en{border-color:var(--red)}
.wd .ic{width:44px;height:44px;flex:none}
.wt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-size:28px;line-height:1.25}
.wd.en .wt{font-family:'Noto Serif SC','Songti SC',serif;font-weight:600}
.back{display:flex;align-items:center;justify-content:center;width:100%;max-width:420px;min-height:64px;margin-top:6px;border:3px solid var(--ink);border-radius:14px;background:var(--wash);text-decoration:none;font-size:26px;font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;letter-spacing:.1em}
</style></head>
<body><main class="wrap">

<div class="sq" id="sq" role="img" aria-label="处"></div>
<div class="mid"><div class="py" id="py">chù</div><button class="big" id="big" type="button" aria-label="处">处</button></div>

<h2>Good friends</h2>
<div class="words"><button class="wd" type="button" data-zh="到处" data-en="everywhere"><svg class="ic" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="4" fill="#1b1b1b"/><path d="M33.0 24.0L43.0 24.0M30.4 30.4L37.4 37.4M24.0 33.0L24.0 43.0M17.6 30.4L10.6 37.4M15.0 24.0L5.0 24.0M17.6 17.6L10.6 10.6M24.0 15.0L24.0 5.0M30.4 17.6L37.4 10.6"/></svg><span class="wt">到处</span></button><button class="wd" type="button" data-zh="远处" data-en="far"><svg class="ic" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="41" r="4" fill="#ece6d6"/><circle cx="41" cy="7" r="4" fill="#ece6d6"/><path d="M12 36L36 12" stroke-dasharray="3 4"/></svg><span class="wt">远处</span></button><button class="wd" type="button" data-zh="近处" data-en="near"><svg class="ic" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="24" r="5" fill="#ece6d6"/><circle cx="40" cy="24" r="5" fill="#ece6d6"/><path d="M15 24H33M19 20l-4 4 4 4M29 20l4 4-4 4"/></svg><span class="wt">近处</span></button><button class="wd" type="button" data-zh="住处" data-en="home"><svg class="ic" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22L24 9L39 22V42H9Z" fill="#ece6d6"/><path d="M4 24L24 6L44 24M33 14V7h5v11"/><path d="M20 42V30H28V42"/></svg><span class="wt">住处</span></button></div>
<a class="back" href="./">回到诗</a>
</main>
<script>var START="处",DATA={"处":{"strokes":["M 261 529 Q 286 572 311 624 Q 332 673 352 697 Q 361 709 355 722 Q 349 735 318 755 Q 290 771 270 768 Q 251 764 262 743 Q 278 715 269 687 Q 227 537 92 336 Q 82 324 81 318 Q 78 306 93 310 Q 133 328 247 505 L 261 529 Z","M 353 289 Q 393 361 432 464 Q 447 494 472 513 Q 487 523 486 532 Q 485 545 454 560 Q 417 581 402 579 Q 390 578 380 569 Q 307 536 266 531 Q 263 531 261 529 C 232 522 217 510 247 505 Q 283 493 330 516 Q 360 537 376 525 Q 385 521 367 458 Q 354 392 312 319 L 293 285 Q 209 158 73 70 Q 66 64 66 60 Q 67 56 75 57 Q 195 72 328 249 Q 331 255 334 258 L 353 289 Z","M 334 258 Q 344 251 356 242 Q 518 103 681 20 Q 729 4 924 51 Q 937 57 941 67 Q 944 77 920 77 Q 847 90 764 100 Q 590 122 371 277 Q 362 284 353 289 L 312 319 Q 279 352 229 359 Q 193 363 166 357 Q 156 351 161 342 Q 168 332 181 332 Q 230 328 288 289 Q 291 288 293 285 L 334 258 Z","M 549 755 Q 576 704 581 656 Q 594 488 575 239 Q 576 206 585 184 Q 592 171 602 178 Q 623 200 625 287 Q 644 693 650 716 Q 660 738 646 752 Q 628 768 596 782 Q 571 792 546 781 Q 533 772 549 755 Z","M 659 497 Q 720 448 795 376 Q 813 357 829 353 Q 838 352 845 363 Q 857 376 841 421 Q 820 482 658 529 Q 648 533 647 521 Q 648 508 659 497 Z"],"medians":[[[272,754],[298,733],[311,709],[282,629],[197,464],[127,360],[90,319]],[[254,509],[316,526],[359,545],[404,545],[423,527],[370,379],[303,255],[228,167],[180,124],[135,92],[72,63]],[[173,346],[219,343],[272,324],[495,166],[575,119],[682,70],[729,60],[885,61],[931,67]],[[556,769],[582,756],[608,727],[611,694],[610,413],[595,186]],[[658,517],[782,438],[815,402],[829,370]]]}},INFO={"处":{"py":"chù","en":"place"}};
(function(){
var NS='http://www.w3.org/2000/svg',seq=0,cur=START,big=document.getElementById('big'),py=document.getElementById('py'),sq=document.getElementById('sq');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var raf=0,showEn=false;
function fit(el,max,min){el.style.fontSize=max+'px';var s=max;while(el.scrollWidth>el.clientWidth+1&&s>min){s-=1;el.style.fontSize=s+'px';}}
function build(ch){
  var d=DATA[ch];var id='c'+(++seq);var h='<svg viewBox="0 0 1024 1024" xmlns="'+NS+'" aria-hidden="true">';
  h+='<path d="M0 0L1024 1024M1024 0L0 1024M512 0V1024M0 512H1024" stroke="#cdbfa8" stroke-width="5" stroke-dasharray="20 16" fill="none"/>';
  h+='<g transform="scale(1,-1) translate(0,-900)"><defs>';
  d.strokes.forEach(function(s,i){h+='<clipPath id="'+id+'_'+i+'"><path d="'+s+'"/></clipPath>';});
  h+='</defs>';
  d.strokes.forEach(function(s){h+='<path d="'+s+'" fill="#1b1b1b" fill-opacity=".1"/>';});
  h+='<g class="ink">';
  d.medians.forEach(function(m,i){
    var p='M'+m.map(function(q){return q[0]+' '+q[1];}).join('L');
    h+='<g clip-path="url(#'+id+'_'+i+')"><path class="md" d="'+p+'" pathLength="1" fill="none" stroke="#1b1b1b" stroke-width="190" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="1" style="visibility:hidden"/></g>';
  });
  h+='</g></g></svg>';
  sq.innerHTML=h;
}
function lens(svg){return Array.prototype.map.call(svg.querySelectorAll('.md'),function(p){return p;});}
function play(){
  cancelAnimationFrame(raf);
  var svg=sq.firstChild,mds=lens(svg),ink=svg.querySelector('.ink');
  if(reduce){mds.forEach(function(p){p.style.visibility='visible';p.setAttribute('stroke-dashoffset','0');});return;}
  var durs=mds.map(function(p){var L=0,pts=DATA[cur].medians[mds.indexOf(p)];for(var i=1;i<pts.length;i++){L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);}return Math.min(1.0,Math.max(.5,L/1500+.25));});
  var gap=.16,starts=[],T=0;durs.forEach(function(d){starts.push(T);T+=d+gap;});
  var hold=1.5,fade=.6,cyc=T+hold+fade,t0=performance.now();
  function frame(now){
    var t=((now-t0)/1000)%cyc;
    mds.forEach(function(p,i){
      var x=Math.min(1,Math.max(0,(t-starts[i])/durs[i]));
      x=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
      if(t>=T)x=1;
      if(x<=.002){p.style.visibility='hidden';}else{p.style.visibility='visible';p.setAttribute('stroke-dashoffset',String(1-x));}
    });
    ink.style.opacity=t>T+hold?String(Math.max(0,1-(t-T-hold)/fade)):'1';
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}
function refreshBig(){
  var i=INFO[cur];
  if(showEn){big.classList.add('en');big.textContent=i.en;py.classList.add('hide');fit(big,Math.min(86,Math.round(innerWidth*.22)),18);}
  else{big.classList.remove('en');big.textContent=cur;big.style.fontSize='';py.classList.remove('hide');py.textContent=i.py;}
}
big.addEventListener('click',function(){showEn=!showEn;refreshBig();});
function setChar(ch){
  cur=ch;showEn=false;refreshBig();build(ch);play();
  var ps=document.querySelectorAll('.pic-svg');for(var k=0;k<ps.length;k++){ps[k].classList.toggle('on',ps[k].getAttribute('data-ch')===ch);}
  var vs=document.querySelectorAll('.vb');for(var j=0;j<vs.length;j++){vs[j].setAttribute('aria-pressed',vs[j].getAttribute('data-ch')===ch?'true':'false');}
}
Array.prototype.forEach.call(document.querySelectorAll('.vb'),function(b){b.addEventListener('click',function(){setChar(b.getAttribute('data-ch'));});});
Array.prototype.forEach.call(document.querySelectorAll('.wd'),function(b){
  var t=b.querySelector('.wt');
  b.addEventListener('click',function(){
    var en=!b.classList.contains('en');b.classList.toggle('en',en);
    t.textContent=en?b.getAttribute('data-en'):b.getAttribute('data-zh');
    if(en){fit(t,26,12);}else{t.style.fontSize='';}
  });
});
function refit(){if(showEn)refreshBig();Array.prototype.forEach.call(document.querySelectorAll('.wd.en .wt'),function(t){fit(t,26,12);});}
addEventListener('resize',refit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
setChar(START);
})();
</script>
</body></html>
