<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>春晓</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f6efdf;--paper2:#fffdf6;--ink:#1b1b1b;--red:#b5342a;--line:#8a8578;--wash:#ece6d6;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'300'%20height%3D'300'%3E%3Cfilter%20id%3D'n'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.8'%20numOctaves%3D'3'%20seed%3D'4'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%20.45%20%200%200%200%200%20.38%20%200%200%200%200%20.25%20%200%200%200%20.09%200'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'300'%20height%3D'300'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E");color:var(--ink);font-family:'Noto Serif SC','Songti SC','STSong','Noto Serif CJK SC','SimSun',serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
a{color:inherit}
.ic{display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.home{max-width:760px;margin:0 auto;padding:10px 12px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
.art{width:100%;border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;line-height:0}
.art svg{width:100%;height:auto;display:block}
.art .col,.art .full{opacity:0;transition:opacity 2s ease-in-out}
.art .col.on{opacity:1}
.art .full{transition:opacity 1.8s ease-in-out}
.art.fin .full{opacity:1}
.art .pl{opacity:.15;transition:opacity 1.2s ease}
.art .pl.on{opacity:1}
.art .ptxt{font-family:'Ma Shan Zheng','KaiTi','STKaiti','Kaiti SC',serif;fill:#1b1b1b;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff9ea;stroke-width:8px;stroke-linejoin:round}
.art .seal rect{fill:#fffdf6;stroke:#6b6b6b;stroke-width:3;transition:all 1.2s}
.art .seal text{font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;fill:#6b6b6b;text-anchor:middle;dominant-baseline:central;transition:fill 1.2s}
.art.fin .seal rect{fill:#c0392b;stroke:#a52a20}
.art.fin .seal text{fill:#fff6e8}
.an{opacity:0;transition:opacity .7s;pointer-events:none}
.an.on{opacity:1}
.an .glow{opacity:0}
.an.on .glow{animation:glow 3.6s ease-in-out both}
@keyframes glow{0%{opacity:0}35%{opacity:.85}100%{opacity:0}}
.an.on .zz{animation:zup 3.4s ease-out both;animation-delay:var(--dl)}
@keyframes zup{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(90px,-170px) scale(1.5);opacity:0}}
.an.on .arc{animation:arc 1.5s ease-out infinite;animation-delay:var(--dl);transform-origin:0 0}
@keyframes arc{0%{transform:scale(.4);opacity:0}25%{opacity:1}100%{transform:scale(1.9);opacity:0}}
.an.on .nt{animation:nt 2.6s ease-out infinite;animation-delay:var(--dl)}
@keyframes nt{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-50px,-120px);opacity:0}}
.an.on .rd{animation:rain var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rain{0%{transform:translate(0,-80px)}100%{transform:translate(-60px,1000px)}}
.an.on .wv{animation:wv 3.4s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes wv{0%{transform:translateX(0);opacity:0}25%{opacity:.9}100%{transform:translateX(520px);opacity:0}}
.an.on .pf{animation:pf var(--d) linear both;animation-delay:var(--dl)}
@keyframes pf{0%{transform:translateY(-60px)}100%{transform:translateY(1040px)}}
.an.on .ps{animation:ps var(--d2) ease-in-out infinite alternate}
@keyframes ps{0%{transform:translateX(-26px) rotate(-70deg)}100%{transform:translateX(30px) rotate(120deg)}}
@media (prefers-reduced-motion:reduce){.an{display:none}}
h1.title{margin:0;font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;font-weight:400;font-size:52px;letter-spacing:.24em;padding-left:.24em;line-height:1.1}
.lines{display:flex;flex-direction:column;gap:10px;width:100%;max-width:460px}
.ln{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:8px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--paper2);font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;font-size:clamp(28px,8.6vw,38px);letter-spacing:.1em;cursor:pointer;text-align:left}
.ln .sqr{width:24px;height:24px;flex:none;border:3px solid var(--ink);border-radius:4px;background:transparent;transition:background .4s}
.ln.done .sqr{background:var(--ink)}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:460px;min-height:72px;border:3px solid var(--ink);border-radius:36px;background:var(--ink);color:var(--paper);font-size:28px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.go svg{width:30px;height:30px;flex:none}
.go.listening{background:var(--red);border-color:var(--red);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.msg{min-height:34px;margin:0;font-size:22px;line-height:1.4;text-align:center;max-width:460px}
.msg.sum{font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;font-size:32px;color:var(--red)}
.grid{display:flex;flex-direction:column;gap:8px;width:100%;max-width:460px;margin-top:4px}
.row{display:flex;gap:6px}
.cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;padding:3px 0 2px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper2);text-decoration:none}
.cell .p{font-size:clamp(10px,3.2vw,13px);line-height:1.35;white-space:nowrap}
.cell .h{font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif;font-size:clamp(28px,9vw,40px);line-height:1.1}
</style></head>

<script>
(function(){
var LINES=["春眠不觉晓","处处闻啼鸟","夜来风雨声","花落知多少"],SIM={"春":"椿淳纯唇醇蠢","眠":"棉绵免勉缅","不":"布步部补卜","觉":"绝决爵角脚较教叫","晓":"小笑消销萧肖校效孝篠曉","处":"出初楚础触除储處","闻":"文纹稳问温吻蚊聞","啼":"提题蹄梯体替涕剔","鸟":"尿袅鳥嫋","夜":"叶页业液野爷也","来":"莱赖來","风":"封峰疯锋丰枫蜂風","雨":"与语宇羽玉于余鱼愈预欲","声":"生升胜圣省剩盛聲","花":"华哗化划画话","落":"洛骆络烙酪","知":"之支只枝芝织汁职执直值指纸至志致质智治","多":"朵躲夺舵垛","少":"绍烧哨稍勺捎韶邵"},SUMMARY="春天真好，到处都有小鸟叫！";
var CANON={};for(var k in SIM){for(var i=0;i<SIM[k].length;i++){CANON[SIM[k][i]]=k;}}
function norm(s){var o='';s=String(s||'');for(var i=0;i<s.length;i++){var c=s[i];if(/[\u4e00-\u9fff]/.test(c))o+=(CANON[c]||c);}return o;}
var NL=LINES.map(norm);
function lcs(a,b){var n=a.length,m=b.length,dp=[],i,j;for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0));}
 for(i=1;i<=n;i++)for(j=1;j<=m;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
 i=n;j=m;var last=-1;while(i>0&&j>0){if(a[i-1]===b[j-1]){if(last<0)last=i-1;i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
 return{len:dp[n][m],last:last};}
function best(s,line){var b={len:0,end:-1};for(var i=0;i<s.length;i++){var w=s.slice(i,i+line.length+2),r=lcs(w,line);if(r.len>b.len)b={len:r.len,end:i+r.last};}return b;}
function need(line){return Math.max(3,Math.round(line.length*0.6));}

var art=document.getElementById('art'),go=document.getElementById('go'),lab=document.getElementById('lab'),msg=document.getElementById('msg');
var lineEls=document.querySelectorAll('.ln');
var done=LINES.map(function(){return false;}),queue=[],busy=false,finished=false,timers=[];

/* ---- soft sound effects (synthesised, no files) ---- */
var AC=window.AudioContext||window.webkitAudioContext,actx=null,live=[];
function audio(){
  if(!AC)return null;
  try{if(!actx)actx=new AC();if(actx.state==='suspended'&&actx.resume)actx.resume();}catch(e){return null;}
  return actx;
}
function noiseBuf(c,sec){var n=Math.floor(c.sampleRate*sec),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),last=0;
  for(var i=0;i<n;i++){var w=Math.random()*2-1;last=(last+0.06*w)/1.06;d[i]=(w*0.35+last*6);}return b;}
function env(g,t,a,peak,hold,r){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+r);}
function snore(c,out,t0){
  /* two light breaths: in (a little higher), out (lower); a gentle flutter, quiet like a sleeping child */
  [[0,0.62,420,0.075],[0.95,0.72,330,0.06]].forEach(function(b){
    var t=t0+b[0],src=c.createBufferSource();src.buffer=noiseBuf(c,1.2);
    var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=b[2];bp.Q.value=0.9;
    var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
    var g=c.createGain(),fl=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    env(g,t,b[1]*0.45,b[3],0.04,b[1]*0.55);
    fl.gain.value=0.78;lfo.frequency.value=26;lg.gain.value=0.22;lfo.connect(lg);lg.connect(fl.gain);
    src.connect(bp);bp.connect(lp);lp.connect(fl);fl.connect(g);g.connect(out);
    src.start(t);src.stop(t+b[1]+0.3);lfo.start(t);lfo.stop(t+b[1]+0.3);
  });
}
function bird(c,out,t0){
  /* a few bright chirps, a short rest, then a little trill (about 2 s) */
  var notes=[[0,3300,4300,.11],[.17,3600,4600,.11],[.34,3200,4100,.12],[.82,3900,3000,.1],[1.0,3800,4700,.09],[1.12,3800,4700,.09],[1.24,3900,4800,.09],[1.36,4000,4900,.08],[1.48,3900,3300,.1]];
  notes.forEach(function(n){
    var t=t0+n[0],o=c.createOscillator(),g=c.createGain(),v=c.createOscillator(),vg=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(n[1],t);o.frequency.exponentialRampToValueAtTime(n[2],t+0.1);
    v.frequency.value=38;vg.gain.value=60;v.connect(vg);vg.connect(o.frequency);
    env(g,t,0.015,n[3],0.03,0.07);o.connect(g);g.connect(out);
    o.start(t);o.stop(t+0.2);v.start(t);v.stop(t+0.2);
  });
}
function rain(c,out,t0){
  /* soft hiss + scattered drips, 1.8 s */
  var D=1.8,src=c.createBufferSource();src.buffer=noiseBuf(c,D+0.4);
  var hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;
  var g=c.createGain();env(g,t0,0.3,0.03,D-0.8,0.5);
  src.connect(hp);hp.connect(g);g.connect(out);src.start(t0);src.stop(t0+D+0.3);
  var t=0.02;
  while(t<D){
    var f=1100+Math.random()*2200,tt=t0+t,o=c.createOscillator(),og=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,tt);o.frequency.exponentialRampToValueAtTime(f*0.62,tt+0.05);
    env(og,tt,0.003,0.035+Math.random()*0.05,0,0.05);o.connect(og);og.connect(out);o.start(tt);o.stop(tt+0.1);
    t+=0.05+Math.random()*0.09;
  }
}
var SFX=[snore,bird,rain,null];
function sfx(i){
  var f=SFX[i];if(!f)return;var c=audio();if(!c)return;
  try{
    var m=c.createGain();m.gain.value=0.9;m.connect(c.destination);live.push(m);
    f(c,m,c.currentTime+0.05);
  }catch(e){}
}
function hush(){live.forEach(function(m){try{m.gain.cancelScheduledValues(0);m.gain.value=0;}catch(e){}});live=[];}
window._sfx={snore:snore,bird:bird,rain:rain};
var STEP=1500;
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t;}
function setMsg(t,sum){msg.textContent=t||'';msg.className='msg'+(sum?' sum':'');}
function showStage(i){
  var c=document.getElementById('c'+(i+1)),a=document.getElementById('an'+(i+1)),p=document.getElementById('pl'+(i+1));
  c.classList.add('on');p.classList.add('on');a.classList.add('on');sfx(i);
  later(function(){a.classList.remove('on');},4600);
}
function pump(){
  if(busy)return;
  var i=queue.shift();
  if(i===undefined){return;}
  busy=true;showStage(i);
  later(function(){busy=false;if(queue.length){pump();}else if(done.every(Boolean)&&!finished){later(finish,500);}},STEP);
}
function reveal(i){
  if(done[i])return false;
  done[i]=true;lineEls[i].classList.add('done');queue.push(i);pump();return true;
}
function finish(){
  if(finished)return;finished=true;stopListening(true);
  art.classList.add('fin');setMsg(SUMMARY,true);setState('again');
}
function handle(text){
  var s=norm(text);if(!s)return;
  var rest=s;
  for(var i=0;i<LINES.length;i++){
    if(done[i])continue;
    var m=best(rest,NL[i]);
    if(m.len>=need(NL[i])){reveal(i);rest=rest.slice(m.end+1);}
  }
}
window.heardText=function(text){var list=Array.isArray(text)?text:[text];list.forEach(handle);return done.slice();};

/* ---- voice ---- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,listening=false,fatal=false,state='idle';
function setState(s){
  state=s;go.classList.toggle('listening',s==='listening');
  lab.textContent=s==='listening'?'Listening':(s==='again'?'Again':'Start');
  go.setAttribute('data-state',s);
}
function errText(code){
  if(code==='not-allowed'||code==='service-not-allowed')return '麦克风没有打开，请点一点诗句。';
  if(code==='audio-capture')return '没有找到麦克风，请点一点诗句。';
  if(code==='network')return '没有网络，请点一点诗句。';
  return '听不清楚，请点一点诗句。';
}
function startListening(){
  if(!SR){setMsg('这个浏览器听不到声音，请点一点诗句。');return;}
  setMsg('');fatal=false;
  try{
    rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
    rec.onresult=function(e){
      var res=e.results,cands=[],r,a;
      for(r=0;r<res.length;r++)for(a=0;a<res[r].length;a++)cands.push(res[r][a].transcript);
      for(a=0;a<3;a++){var j='';for(r=0;r<res.length;r++){var alt=res[r][a]||res[r][0];if(alt)j+=alt.transcript;}cands.push(j);}
      cands.forEach(handle);
    };
    rec.onerror=function(e){
      var c=e&&e.error;if(c==='no-speech'||c==='aborted')return;
      fatal=true;listening=false;setMsg(errText(c));
    };
    rec.onend=function(){
      if(listening&&!fatal&&!finished){later(function(){if(!listening||fatal||finished)return;try{rec.start();}catch(err){}},250);}
      else if(!finished&&state==='listening'){setState('idle');}
    };
    listening=true;setState('listening');rec.start();
  }catch(err){listening=false;setState('idle');setMsg(errText('other'));}
}
function stopListening(quiet){
  listening=false;
  if(rec){try{rec.abort();}catch(e){}}
  if(!quiet&&!finished)setState('idle');
}
function reset(){
  hush();timers.forEach(clearTimeout);timers=[];queue=[];busy=false;finished=false;listening=false;
  if(rec){try{rec.abort();}catch(e){}}
  done=LINES.map(function(){return false;});
  Array.prototype.forEach.call(lineEls,function(l){l.classList.remove('done');});
  Array.prototype.forEach.call(document.querySelectorAll('.col,.pl,.an'),function(n){n.classList.remove('on');});
  art.classList.remove('fin');setMsg('');setState('idle');
}
go.addEventListener('click',function(){audio();
  if(state==='again'){reset();return;}
  if(state==='listening'){stopListening();return;}
  startListening();
});
Array.prototype.forEach.call(lineEls,function(l,i){l.addEventListener('click',function(){audio();reveal(i);});});
setState('idle');
})();
</script>
